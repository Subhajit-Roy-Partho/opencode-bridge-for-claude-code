[package]
name = "opencode-bridge"
version = "0.5.0"
edition = "2021"
description = "MCP bridge between Claude Code and opencode (Rust port of server.mjs)"
license = "MIT"

[[bin]]
name = "opencode-bridge"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
